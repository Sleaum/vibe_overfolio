<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="__THEME_LIGHT__" />
    <meta
      name="description"
      content="Overfolio transforme ton Google Sheet en graphiques clairs : répartition, évolution et flux de ton patrimoine."
    />
    <title>Overfolio</title>
    <!-- Mode sombre posé avant le premier affichage (pas de flash blanc) : choix enregistré, sinon réglage du système.
         Les __THEME_…__ sont remplacés au build par les valeurs de src/lib/theme.js (plugin « theme » de vite.config.ts). -->
    <script>
      (function () {
        var theme = null
        try { theme = localStorage.getItem('__THEME_KEY__') } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '__THEME_DARK__')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
